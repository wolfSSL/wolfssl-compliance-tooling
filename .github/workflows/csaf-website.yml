name: CSAF website

# Checks the published provider directory on the first day of each month.
# A pull request is not the website, so this job does not run on
# pull_request. The folder URL returns 403; csaf-fetch reads index.txt
# instead of listing the folder. The live tree is unsigned (role
# csaf_provider). Do not pass --fingerprint until .asc files are published.

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
    inputs:
      vex:
        description: 'Also check name.cdx.json beside each document'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  website:
    name: verify published CSAF
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download the provider directory and verify hashes
        run: |
          python3 central/csaf-fetch \
            --url https://www.wolfssl.com/.well-known/csaf \
            --out "${RUNNER_TEMP}/csaf"
          python3 central/csaf-verify \
            --root "${RUNNER_TEMP}/csaf"

      # csaf-publish copies *.csaf.json only, so the live tree has no
      # name.cdx.json yet. The monthly run does not ask for those files.
      # Turn this input on after the publisher lands:
      # https://github.com/wolfSSL/wolfssl-compliance-tooling/issues/59
      - name: Check VEX files
        if: ${{ always() && inputs.vex }}
        run: |
          python3 central/csaf-fetch \
            --url https://www.wolfssl.com/.well-known/csaf \
            --out "${RUNNER_TEMP}/csaf-vex" \
            --vex
