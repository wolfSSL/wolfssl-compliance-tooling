name: wolfssl-compliance-tooling SBOM (reusable)

# A reusable workflow for product repositories. A product calls it to build its
# SBOM with the vendored wolfssl-compliance-tooling driver, validate the output, and prove that no
# absolute host path leaked into the document.
#
# Example caller in a product repo:
#
#   jobs:
#     sbom:
#       uses: wolfSSL/wolfssl-compliance-tooling/.github/workflows/sbom-reusable.yml@v1
#       with:
#         name-prefix: wolfboot
#         build-command: make sbom
#         outputs: "*.cdx.json *.spdx.json"

on:
  workflow_call:
    inputs:
      name-prefix:
        description: Expected metadata.component.name prefix (the product name).
        required: true
        type: string
      build-command:
        description: Command that builds the product and generates the SBOM.
        required: true
        type: string
      outputs:
        description: Space-separated globs of the generated SBOM files.
        required: false
        default: "*.cdx.json *.spdx.json"
        type: string
      vendored-path:
        description: Where wolfssl-compliance-tooling share/ is vendored in the product.
        required: false
        default: tools/sbom
        type: string
      wolfssl-compliance-tooling-ref:
        description: wolfssl-compliance-tooling ref to check drift against (empty = skip drift).
        required: false
        default: ""
        type: string

jobs:
  sbom:
    runs-on: ubuntu-latest
    # This job only reads the product tree and uploads an artifact.
    permissions:
      contents: read
    steps:
      - name: Checkout product
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Caller inputs are bound to env and referenced as "$VAR" in the shell.
      # Never interpolate ${{ inputs.* }} directly into a run: block: the runner
      # substitutes it before the shell parses the script, so a value containing
      # shell metacharacters would execute as code (this is a reusable workflow
      # shipped to every product repo).  env values are not re-parsed by ${{ }}.
      - name: Check vendored drift
        if: inputs.wolfssl-compliance-tooling-ref != ''
        env:
          WOLFSSL_COMPLIANCE_TOOLING_REF: ${{ inputs.wolfssl-compliance-tooling-ref }}
          VENDORED_PATH: ${{ inputs.vendored-path }}
        run: |
          git clone --depth 1 --branch "$WOLFSSL_COMPLIANCE_TOOLING_REF" \
            https://github.com/wolfSSL/wolfssl-compliance-tooling _wolfssl-compliance-tooling
          python _wolfssl-compliance-tooling/tools/wolfssl-compliance-tooling-sync \
            --dest "$GITHUB_WORKSPACE" \
            --subdir "$VENDORED_PATH" \
            --check

      - name: Build SBOM
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          bash -c "$BUILD_COMMAND"

      - name: Validate SBOM
        env:
          VENDORED_PATH: ${{ inputs.vendored-path }}
          NAME_PREFIX: ${{ inputs.name-prefix }}
          OUTPUTS: ${{ inputs.outputs }}
        run: |
          python "$VENDORED_PATH/validate_sbom.py" \
            --name-prefix "$NAME_PREFIX" $OUTPUTS

      - name: Assert no host path leak
        env:
          OUTPUTS: ${{ inputs.outputs }}
        run: |
          # A published SBOM must not contain build-machine absolute paths.
          # grep exit 0 = match (fail), 1 = clean, >=2 = real error (e.g. a glob
          # that matched no file): treat only 1 as "clean" so a bad glob can't
          # silently report OK.
          set +e
          out="$(grep -REn '"/(home|Users|root)/' $OUTPUTS)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: absolute host path found in SBOM (scrub failed):" >&2
            echo "$out" >&2
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "ERROR: could not scan SBOM outputs (glob '$OUTPUTS' matched no file?)." >&2
            exit 1
          fi
          echo "OK: no host path leak."

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.name-prefix }}
          path: ${{ inputs.outputs }}
