name: wolfGlass self-test

# Runs the wolfGlass unit and integration tests on every change. The vendored
# gen-sbom makes the integration path self-contained.

on:
  push:
    branches: [master]
  pull_request:

# This workflow only reads the repo and runs tests; no write access needed.
permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wolfGlass
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install unit-test dependencies
        run: python -m pip install --user pcpp

      - name: Syntax-check all Python
        run: |
          python -m py_compile \
            share/sbom-driver.py \
            share/gen-sbom \
            share/validate_sbom.py \
            share/frontends/compdb_sbom.py \
            share/frontends/iar_sbom.py \
            share/frontends/zephyr_sbom.py \
            central/gen-advisory \
            central/test_gen_advisory.py \
            central/advisory-completeness \
            central/advisory-overlay-draft \
            central/test_advisory_completeness.py \
            central/test_advisory_overlay_draft.py \
            central/csaf-publish \
            central/csaf-verify \
            central/csaf-keygen \
            central/test_csaf_publish.py \
            provenance/bomsh_verify.py \
            tools/wolfglass-sync \
            tests/test_gen_sbom.py \
            tests/test_sbom.py \
            tests/test_sbom_identity.py \
            tests/test_low_findings.py \
            tests/test_iar_sbom.py \
            tests/test_wolfglass_sync.py

      - name: Run generator unit tests
        run: python -m unittest tests/test_gen_sbom.py

      - name: Run advisory generator unit tests
        run: python -m unittest central/test_gen_advisory.py

      - name: Run advisory completeness and publish unit tests
        run: python -m unittest central/test_advisory_completeness.py central/test_advisory_overlay_draft.py central/test_csaf_publish.py

      - name: Run SBOM identity tests
        run: python -m unittest tests/test_sbom_identity.py

      - name: Run low-findings tests
        run: python -m unittest tests/test_low_findings.py

      - name: Run IAR frontend tests
        run: python -m unittest tests/test_iar_sbom.py

      - name: Run wolfglass-sync tests
        run: python -m unittest tests/test_wolfglass_sync.py

      - name: Run self-test
        run: python tests/test_sbom.py
